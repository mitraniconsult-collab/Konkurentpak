<style>
  /* Brand colours from konkurentpack.com: accent #245253, body text #323232 */
  :root {
    --bg: #F2F5F4;
    --card: #FFFFFF;
    --ink: #245253;
    --text: #323232;
    --mid: #5E6A68;
    --line: rgba(36, 82, 83, .14);
    --sample: #B4561F;
    --ease: cubic-bezier(.19, 1, .22, 1);
    --font: 'Archivo', 'Onest', sans-serif;
    --gut: max(clamp(16px, 3.2vw, 48px), env(safe-area-inset-left, 0px));
    --gut-r: max(clamp(16px, 3.2vw, 48px), env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  [hidden] { display: none !important; } /* Tailwind's .grid/.flex would otherwise override the hidden attribute */
  html, body { font-family: var(--font); font-weight: 400; background: var(--bg); color: var(--text); }
  body { font-size: 16px; line-height: 1.55; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
  .gutter { padding-left: var(--gut); padding-right: var(--gut-r); }
  ::selection { background: var(--ink); color: #fff; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* type roles */
  .h-sec { font-weight: 800; text-transform: uppercase; font-size: clamp(36px, 5vw, 80px); letter-spacing: -0.03em; line-height: .92; text-wrap: balance; color: var(--ink); }
  .h-dlg { font-weight: 800; text-transform: uppercase; font-size: clamp(26px, 3vw, 40px); letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
  .t-label { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; line-height: 1.3; }
  .t-name { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .t-body { font-size: 15.5px; color: var(--mid); max-width: 60ch; }
  .tag { display: inline-block; background: var(--ink); color: #fff; padding: 4px 7px; border-radius: 2px; }
  .tag--sample { display: inline-block; background: transparent; color: var(--sample); border: 1px solid currentColor; padding: 2px 5px; border-radius: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* announcement ticker */
  .ticker { background: var(--ink); color: #fff; overflow: hidden; white-space: nowrap; }
  .ticker__track { display: inline-flex; animation: tick 40s linear infinite; padding-block: 9px; }
  .ticker__track span { padding-right: 3.5rem; }
  @keyframes tick { to { transform: translateX(-50%); } }

  /* nav */
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(242, 245, 244, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav a, .nav button, .nav summary { font-weight: 600; font-size: 13.5px; }
  .nav__bar { height: 84px; display: flex; align-items: center; gap: 16px; }
  .nav__logo img { height: 44px; width: auto; max-width: none; }
  .nav__tag { display: block; margin-top: 3px; font-size: 10px; color: var(--mid); }
  .sbox { position: relative; display: flex; }
  .sbox input { flex: 1; min-width: 0; width: 100%; height: 44px; border: 1px solid var(--ink); border-right: 0; background: var(--card); border-radius: 2px 0 0 2px; padding: 0 12px 0 40px; font: inherit; font-size: 14px; }
  .sbox svg { position: absolute; left: 13px; top: 14px; pointer-events: none; }
  .sbox button { flex: none; height: 44px; padding: 0 18px; background: var(--ink); color: #fff; border-radius: 0 2px 2px 0; }
  .nav__search { flex: none; }
  .nav__panel { display: none; position: absolute; left: 0; right: 0; top: 100%; padding-top: 14px; padding-bottom: 14px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 24px 48px rgba(15, 20, 18, .12); }
  .nav__search.open .nav__panel { display: block; animation: fade .25s var(--ease); }
  .nav__panel .sbox { max-width: 640px; margin: 0 auto; }
  .nav__search input:focus { outline: none; }
  .nav__search.open .x { background: var(--ink); color: #fff; border-color: var(--ink); }
  @keyframes fade { from { opacity: 0; transform: translateY(-6px); } }
  .nav__util { display: flex; align-items: center; gap: 12px; flex: none; }
  .nav__phone { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; background: var(--card); white-space: nowrap; }
  .nav .nav__burger { display: none; font-size: 20px; }
  .nav__cats { display: flex; align-items: center; gap: 28px; margin: 0 auto; }
  .nav__cats > a, .nav__cats summary { position: relative; white-space: nowrap; cursor: pointer; list-style: none; }
  .nav__cats summary::-webkit-details-marker { display: none; }
  .nav__cats summary::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 0 3px 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  .nav__cats > a::after, .nav__cats summary::before { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
  .nav__cats > a:hover::after, .nav__dd[open] summary::before, .nav__cats summary:hover::before { transform: scaleX(1); }
  .nav__dd { position: relative; }
  .nav__menu { position: absolute; top: calc(100% + 18px); left: -16px; min-width: 280px; z-index: 5; display: grid; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 2px; box-shadow: 0 24px 48px rgba(15, 20, 18, .14); }
  .nav__menu a { padding: 10px 12px; border-radius: 2px; }
  .nav__menu a:hover { background: var(--bg); }
  .nav__menu a.all { margin-top: 6px; border-top: 1px solid var(--line); border-radius: 0; padding-top: 14px; color: var(--teal, var(--ink)); }
  .menu__links a, .menu__links summary { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px !important; }
  .menu__links .sub a { padding-left: 16px; font-weight: 500; }
  .progress { position: absolute; left: 0; bottom: -2px; height: 2px; width: 100%; background: var(--ink); transform: scaleX(var(--sp, 0)); transform-origin: left; }
  .cartbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; background: var(--ink); color: #fff; border-radius: 2px; }
  .bag__n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #fff; color: var(--ink); font-size: 11px; }
  .bag__n.bump { animation: bump .5s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.35); } }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; }
  .lang button { padding: 6px 9px; font-size: 12px !important; }
  .lang button[aria-pressed=true] { background: var(--ink); color: #fff; }
  @media (max-width: 1180px) { .nav .nav__cats { display: none; } .nav .nav__burger { display: grid; } .nav__phone { display: none; } }
  @media (max-width: 899px) { .cartbtn__total { display: none; } }
  @media (max-width: 640px) { .nav__bar .lang, .nav__bar .nav__search { display: none; } .nav__bar { height: 68px; gap: 12px; } .nav__logo img { height: 32px; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .6em; font-weight: 600; font-size: 14px; padding: 14px 22px; border-radius: 2px; background: var(--ink); color: #fff; transition: background .3s; }
  .btn:hover { background: #1a3d3e; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); padding: 12px 18px; }
  .btn--ghost:hover { background: var(--ink); color: #fff; }

  /* photos get the brief's treatment; drawn boxes sit on a light floor */
  .ph { position: relative; overflow: hidden; background: linear-gradient(180deg, #e4e8e6 0 66%, #d6dcd9 66%); }
  .ph > img, .ph > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.35) contrast(1.06) hue-rotate(-8deg); }
  .ph > svg { padding: 16%; }

  /* hero */
  .hero { position: relative; min-height: clamp(380px, 44vw, 700px); overflow: hidden; display: grid; place-items: end center; }
  .hero__word { font-weight: 900; font-size: min(10.6vw, 200px); line-height: .8; letter-spacing: -0.05em; text-transform: uppercase; white-space: nowrap; margin-bottom: clamp(130px, 15vw, 230px); color: var(--ink); will-change: transform; }
  .hero__box { position: absolute; z-index: 1; opacity: .85; left: 50%; bottom: clamp(40px, 5vw, 90px); width: clamp(200px, 30vw, 500px); margin-left: calc(clamp(200px, 30vw, 500px) / -2); will-change: transform; filter: drop-shadow(0 30px 30px rgba(15, 20, 18, .22)); }
  .hero__box svg { display: block; width: 100%; height: auto; }
  .hero__cta { position: absolute; top: 24px; right: var(--gut-r); }
  .load { animation: rise 1.1s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } }
  @media (max-width: 640px) { .hero__cta { display: none; } }

  /* category cards */
  .cat .ph { aspect-ratio: 4 / 3; }
  .cat .ph > img { transition: transform 1.1s var(--ease); }
  .cat:hover .ph > img { transform: scale(1.09); }
  .arrow { display: inline-block; transition: transform .5s var(--ease); color: var(--ink); }
  .cat:hover .arrow { transform: translateX(6px); }

  /* catalogue */
  .shop { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: clamp(20px, 3vw, 48px); align-items: start; }
  .filters { position: sticky; top: 108px; display: grid; gap: 22px; }
  .filters fieldset { display: grid; gap: 8px; }
  .filters legend { margin-bottom: 8px; }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14.5px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--ink); flex: none; }
  .chk small { margin-left: auto; color: var(--mid); }
  select.sel, .inp { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 2px; padding: 0 12px; font: inherit; font-size: 14.5px; color: var(--text); }
  textarea.inp { height: auto; padding: 10px 12px; }
  .inp.bad { border-color: #b3261e; }
  .filters__toggle { display: none; }
  @media (max-width: 900px) {
    .shop { grid-template-columns: minmax(0, 1fr); }
    .filters { position: static; display: none; padding: 18px; background: var(--card); border: 1px solid var(--line); }
    .filters.open { display: grid; }
    .filters__toggle { display: inline-flex; }
  }
  .grid-products { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 18px; }
  @media (max-width: 1180px) { .grid-products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { display: flex; flex-direction: column; }
  .card .ph { aspect-ratio: 3 / 4; cursor: pointer; }
  .card .ph > img, .card .ph > svg { transition: transform 1.1s var(--ease); }
  .card:hover .ph > img, .card:hover .ph > svg { transform: scale(1.04); }
  .card__add { position: absolute; left: 0; right: 0; bottom: 0; padding: 15px; background: var(--ink); color: #fff; font-weight: 600; font-size: 13.5px; text-align: center; transform: translateY(101%); transition: transform .55s var(--ease); z-index: 2; }
  .card:hover .card__add, .card:focus-within .card__add { transform: none; }
  .card__badges { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  .card__badges .t-label { background: var(--card); color: var(--ink); padding: 4px 7px; border-radius: 2px; }
  .card__open { all: unset; cursor: pointer; }
  .card__open:hover { text-decoration: underline; }
  .card__open:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (hover: none) { .card__add { transform: none; } }
  .empty { padding: 48px 0; }

  /* dialogs: product, cart drawer, checkout, quote */
  dialog { color: var(--text); background: var(--bg); border: 0; padding: 0; max-width: none; max-height: none; }
  dialog::backdrop { background: rgba(15, 30, 30, .45); backdrop-filter: blur(3px); }
  .dlg { width: min(1100px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); margin: auto; overflow: auto; border-radius: 2px; }
  .dlg__head { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .x { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 2px; font-size: 18px; color: var(--ink); flex: none; }
  .x:hover { border-color: var(--ink); }
  .drawer { width: min(460px, 100vw); height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; }
  .drawer[open] { display: flex; flex-direction: column; animation: slide .5s var(--ease); }
  @keyframes slide { from { transform: translateX(100%); } }
  .tiers { width: 100%; border-collapse: collapse; }
  .tiers td, .tiers th { padding: 10px 0; border-top: 1px solid var(--line); text-align: left; }
  .tiers td:last-child, .tiers th:last-child { text-align: right; }
  .tiers tr.on td { color: var(--ink); font-weight: 700; }
  .qty { display: inline-flex; border: 1px solid var(--line); background: var(--card); border-radius: 2px; }
  .qty button { width: 40px; height: 44px; font-size: 18px; color: var(--ink); }
  .qty input { width: 72px; text-align: center; border: 0; border-inline: 1px solid var(--line); font: inherit; font-weight: 600; background: transparent; -moz-appearance: textfield; }
  .qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .qty--sm button { width: 32px; height: 34px; font-size: 15px; }
  .qty--sm input { width: 56px; font-size: 14px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); background: var(--card); border-radius: 2px; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .opt input { margin-top: 3px; accent-color: var(--ink); }
  .field { display: grid; gap: 6px; }
  .note { font-size: 13px; color: var(--mid); }

  /* materials */
  .flutes { width: 100%; border-collapse: collapse; }
  .flutes th, .flutes td { text-align: left; padding: 14px 0; border-top: 1px solid var(--line); }
  .flutes td:last-child, .flutes th:last-child { text-align: right; }

  /* custom-size promo */
  .season__img { min-height: 380px; }
  .season__img > img { transform: translateY(var(--dy, 0px)) scale(1.12); will-change: transform; }

  /* counters count with CSS: @property makes --n animatable */
  @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
  .count { --n: 0; counter-reset: n var(--n); transition: --n 2.4s cubic-bezier(.19, 1, .22, 1); font-weight: 800; font-size: clamp(56px, 7vw, 112px); letter-spacing: -0.04em; line-height: .9; font-variant-numeric: tabular-nums; color: var(--ink); }
  .count::before { content: counter(n); }
  .count.go { --n: var(--to); }

  /* reveal */
  .rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
  .rv.wait { opacity: 0; transform: translateY(28px); }

  /* cookie banner */
  .cookie { position: fixed; z-index: 70; left: var(--gut); right: var(--gut-r); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; padding: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(15, 30, 30, .18); border-radius: 2px; }

  input[type=email].line { background: transparent; border: 0; border-bottom: 1px solid var(--ink); padding: 12px 0; font: inherit; width: 100%; }
  footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transform: none !important; animation: none !important; transition: none !important; }
    .rv.wait { opacity: 1; }
    .count { --n: var(--to); }
  }
</style>
</head>

    render();
  }
  $('#fLen').value = state.len; $('#fStock').checked = state.stock; $('#fPriced').checked = state.priced; $('#sort').value = state.sort; $('#q').value = state.q;
  $('#filters').addEventListener('change', readFilters);
  $('#filters').addEventListener('reset', () => setTimeout(readFilters));
  $('#sort').addEventListener('change', readFilters);
  $('#q').addEventListener('input', readFilters);
  $('#q2').addEventListener('input', () => { $('#q').value = $('#q2').value; readFilters(); });
  const goShop = () => $('#grid').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
  $$('#searchForm, #searchForm2').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); $('#menuDlg').close(); goShop(); }));
  const sf = $('#searchForm'), sq = $('#q');
  const openSearch = o => { sf.classList.toggle('open', o); $('#searchBtn').setAttribute('aria-expanded', o); sq.tabIndex = o ? 0 : -1; if (o) sq.focus(); };
  $('#searchBtn').addEventListener('click', () => { if (!sf.classList.contains('open')) openSearch(true); else if (!sq.value.trim()) openSearch(false); else goShop(); });
  sq.addEventListener('keydown', e => { if (e.key === 'Escape') { sq.value = ''; readFilters(); openSearch(false); } });
  document.addEventListener('click', e => { if (sf.classList.contains('open') && !e.target.closest('#searchForm') && !sq.value.trim()) openSearch(false); });
  if (state.q) openSearch(true);
  $('#menuBtn').addEventListener('click', () => $('#menuDlg').showModal());
  $('#menuDlg').addEventListener('click', e => { if (e.target.closest('a')) $('#menuDlg').close(); });
  document.addEventListener('click', e => { if (!e.target.closest('#prodDd')) $('#prodDd').open = false; });
  $('#prodDd').addEventListener('click', e => { if (e.target.closest('a')) $('#prodDd').open = false; });
  $('#filtersToggle').addEventListener('click', e => { const f = $('#filters'); f.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', f.classList.contains('open')); });
  $$('.cat').forEach(a => a.addEventListener('click', () => { state.cat = [a.dataset.cat]; buildFilters(); readFilters(); }));

  function filtered() {
    const q = state.q.toLowerCase();
    const list = PRODUCTS.filter(p =>
      (!state.cat.length || state.cat.includes(p.cat)) && (!state.wave.length || state.wave.includes(p.wave)) && (!state.color.length || state.color.includes(p.color)) &&
      (!state.len || (p.dims && p.dims[0] <= +state.len)) && (!state.stock || p.stock > 0) && (!state.priced || p.price) &&
      (!q || [p.name.bg, p.name.en, p.desc.bg, p.desc.en, p.dims?.join('×') ?? '', p.dims?.join('x') ?? '', p.wave, t('cat_' + p.cat)].join(' ').toLowerCase().includes(q)));
    const sorts = {
      asc: (a, b) => (minPrice(a) ?? Infinity) - (minPrice(b) ?? Infinity),
      desc: (a, b) => (minPrice(b) ?? -1) - (minPrice(a) ?? -1),
      name: (a, b) => pname(a).localeCompare(pname(b), lang),
      pop: (a, b) => b.pop - a.pop,
    };
    return list.sort(sorts[state.sort] || sorts.pop);
  }
  const cardHtml = (p, small) => `
    <article class="card">
      <div class="ph" data-open="${p.id}">
        ${art(p)}
        <div class="card__badges">${p.price ? '' : `<span class="t-label">${esc(t('made'))}</span>`}${p.stock === 0 ? `<span class="t-label">${esc(t('outStock'))}</span>` : ''}</div>
        ${small ? '' : p.price ? `<button class="card__add" type="button" data-add="${p.id}">${esc(t('add'))}</button>` : `<button class="card__add" type="button" data-quote="${p.id}">${esc(t('quote'))}</button>`}
      </div>
      <h3 class="t-name pt-3"><button class="card__open" type="button" data-open="${p.id}">${esc(pname(p))}</button></h3>
      <p class="t-label pt-1" style="color:var(--mid)">${esc(t('cat_' + p.cat))} · ${p.wave}</p>
      <p class="t-name num pt-2" style="color:var(--ink)">${p.price ? `${t('from')} ${money(minPrice(p))} ${t('perPc')}` : esc(t('onRequest'))}</p>
      ${p.price ? `<p class="pt-1"><span class="t-label tag--sample">${esc(t('sample'))}</span></p>` : ''}
    </article>`;
  function render() {
    const list = filtered();
    $('#grid').innerHTML = list.map(p => cardHtml(p)).join('');
    $('#empty').hidden = list.length > 0;
    $('#count').textContent = t('count', list.length);
    $('#crumbCat').textContent = state.cat.length === 1 ? ' / ' + t('cat_' + state.cat[0]) : '';
  }

  /* ---------- cart ---------- */
  let cart = store.get('kp_cart', {}); // { productId: qty }
  Object.keys(cart).forEach(id => { if (!byId[id]?.price) delete cart[id]; });
  const lines = () => Object.entries(cart).map(([id, q]) => ({ p: byId[id], q, u: unitPrice(byId[id], q) }));
  const totals = () => { const sub = lines().reduce((s, l) => s + l.u * l.q, 0); return { sub, vat: sub * VAT, total: sub * (1 + VAT) }; };
  function addToCart(id, q, btn) {
    cart[id] = (cart[id] || 0) + q; store.set('kp_cart', cart); renderCart();
    const n = $('#bagN'); n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump');
    if (btn) { clearTimeout(btn._t); btn.textContent = t('added'); btn._t = setTimeout(() => btn.textContent = t('add'), 1300); }
  }
  function setQty(id, q) { q = Math.max(0, Math.min(99999, Math.floor(q) || 0)); if (q) cart[id] = q; else delete cart[id]; store.set('kp_cart', cart); renderCart(); }
  const qtyCtl = (id, q, sm) => `<div class="qty ${sm ? 'qty--sm' : ''}"><button type="button" data-step="-1" data-id="${id}" aria-label="−1">−</button><input class="num" type="number" min="1" value="${q}" data-qty="${id}" aria-label="${esc(t('qty'))}"><button type="button" data-step="1" data-id="${id}" aria-label="+1">+</button></div>`;
  const sumRow = (k, v, big) => `<div class="flex justify-between ${big ? 't-name pt-2' : 'note'}" ${big ? 'style="font-size:17px;color:var(--ink)"' : ''}><span>${esc(t(k))}</span><span class="num">${v}</span></div>`;
  function renderCart() {
    const L = lines(), T = totals(), n = L.reduce((s, l) => s + l.q, 0);
    $('#bagN').textContent = n; $('#cartTotal').textContent = n ? money(T.total) : '';
    $('#cartItems').innerHTML = L.length ? L.map(({ p, q, u }) => `
      <div class="grid grid-cols-[72px_1fr] gap-4 py-4 border-b" style="border-color:var(--line)">
        <div class="ph" style="aspect-ratio:1">${art(p)}</div>
        <div class="grid gap-2">
          <p class="t-name">${esc(pname(p))}</p>
          <p class="note num">${money(u)} ${t('perPc')} · ${p.wave}</p>
          <div class="flex items-center justify-between gap-3">${qtyCtl(p.id, q, true)}<b class="t-name num">${money(u * q)}</b></div>
          <button type="button" class="note text-left underline" data-remove="${p.id}">${esc(t('remove'))}</button>
        </div>
      </div>`).join('') : `<p class="t-body pt-6">${esc(t('cartEmpty'))}</p>`;
    $('#cartSum').innerHTML = L.length ? sumRow('subtotal', money(T.sub)) + sumRow('vat', money(T.vat)) + sumRow('shipping', esc(t('shipCalc'))) + sumRow('total', money(T.total), true) +
      `<button class="btn w-full mt-3" type="button" id="goCheckout">${esc(t('toCheckout'))}</button><p class="pt-1"><span class="t-label tag--sample">${esc(t('sample'))}</span></p>` : '';
    if ($('#coDlg').open && $('#coDone').hidden) renderCheckoutSummary();
  }
  $('#cartBtn').addEventListener('click', () => $('#cartDlg').showModal());

  /* ---------- product page ---------- */
  let cur = null;
  function openProduct(id) {
    const p = byId[id]; cur = p;
    $('#pCrumb').textContent = `${t('navShop')} / ${t('cat_' + p.cat)}`;
    $('#pImg').innerHTML = art(p);
    $('#pName').textContent = pname(p);
    $('#pDesc').textContent = p.desc[lang];
    $('#pBadges').innerHTML = p.price ? `<span class="t-label tag--sample">${esc(t('sample'))}</span>` : `<span class="t-label tag">${esc(t('made'))}</span>`;
    const spec = (k, v) => `<div><dt class="t-label" style="color:var(--mid)">${esc(t(k))}</dt><dd class="t-name pt-1">${esc(v)}</dd></div>`;
    $('#pSpecs').innerHTML = spec('category', t('cat_' + p.cat)) + spec('wave', p.wave) + spec('color', t('color_' + p.color)) + (p.dims ? spec('dims', `${p.dims.join(' × ')} ${t('mm')}`) : '') +
      spec('avail', p.stock == null ? t('made') : p.stock > 0 ? t('inStock', p.stock) : t('outStock'));
    $('#pBuy').innerHTML = p.price ? `
      <table class="tiers num"><thead><tr><th class="t-label">${esc(t('tierHead'))}</th><th class="t-label">${esc(t('exVat'))}</th></tr></thead>
        <tbody>${p.price.map(([m, v], i) => `<tr data-tier="${m}"><td>${m}${p.price[i + 1] ? '–' + (p.price[i + 1][0] - 1) : '+'} ${t('pcs')}</td><td>${money(v)}</td></tr>`).join('')}</tbody></table>
      <div class="flex flex-wrap items-center gap-4 pt-5">${qtyCtl('p', 100)}<button class="btn" type="button" id="pAdd" ${p.stock === 0 ? 'disabled' : ''}>${esc(t(p.stock === 0 ? 'outStock' : 'add'))}</button></div>
      <p class="t-name num pt-3" id="pLine" style="color:var(--ink)"></p>` :
      `<button class="btn" type="button" data-quote="${p.id}">${esc(t('quote'))}</button>`;
    const score = x => (x.cat === p.cat) * 2 + (x.wave === p.wave) + (!!x.price === !!p.price);
    $('#pRelated').innerHTML = PRODUCTS.filter(x => x.id !== p.id).sort((a, b) => score(b) - score(a) || b.pop - a.pop).slice(0, 4).map(x => cardHtml(x, true)).join('');
    updateLine();
    if (!$('#pDlg').open) $('#pDlg').showModal();
    $('#pDlg').scrollTop = 0;
  }
  function updateLine() {
    if (!cur?.price) return;
    const q = Math.max(1, +$('#pDlg [data-qty="p"]').value || 1), u = unitPrice(cur, q);
    $$('#pDlg [data-tier]').forEach(r => r.classList.toggle('on', unitPrice(cur, +r.dataset.tier) === u));
    $('#pLine').textContent = `${q} ${t('pcs')} × ${money(u)} = ${money(u * q)} ${t('exVat')}`;
  }

  /* ---------- checkout ---------- */
  function renderCheckoutSummary() {
    const T = totals(), f = $('#coForm');
    $('#coLines').innerHTML = lines().map(({ p, q, u }) => `<div class="flex justify-between gap-3 note"><span>${esc(pname(p))} × ${q}</span><span class="num">${money(u * q)}</span></div>`).join('');
    $('#coTotals').innerHTML = sumRow('subtotal', money(T.sub)) + sumRow('vat', money(T.vat)) + sumRow('shipping', f.ship.value === 'pickup' ? money(0) : esc(t('shipCalc'))) + sumRow('total', money(T.total), true);
    $('#coSubmit').textContent = f.pay.value === 'card' ? `${t('placeCard')} · ${money(T.total)}` : t('placeOrder');
    $('#coSubmit').disabled = !lines().length;
  }
  function syncCheckout() {
    const ship = $('#coForm').ship.value, company = $('#coCompany').checked;
    $('#coCompanyFields').hidden = !company; $('#coFirm').required = $('#coEik').required = company;
    $('#coAddrFields').hidden = ship === 'pickup'; $('#coCity').required = $('#coAddr').required = ship !== 'pickup';
    $('#coAddrLabel').textContent = t(ship === 'address' ? 'address' : 'office');
    renderCheckoutSummary();
  }
  $('#coForm').addEventListener('change', syncCheckout);
  $('#coForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.currentTarget, err = $('#coError');
    const fields = [...f.querySelectorAll('.inp')].filter(i => !i.closest('[hidden]'));
    fields.forEach(i => i.classList.toggle('bad', !i.checkValidity()));
    const bad = fields.filter(i => !i.checkValidity());
    if (bad.length) { err.textContent = t('errFields'); err.hidden = false; bad[0].focus(); return; }
    if (!$('#coTerms').checked) { err.textContent = t('errTerms'); err.hidden = false; return; }
    // Never display a fabricated order number: checkout is not connected to an order backend.
    err.textContent = lang === 'bg'
      ? 'Онлайн поръчките все още не са активирани. Това е предварителна версия на магазина. Не е направена поръчка или плащане.'
      : 'Online orders are not active yet. This is a preview of the shop. No order or payment has been made.';
    err.hidden = false;
  });

  /* ---------- quote request ---------- */
  function openQuote(id) {
    const p = byId[id];
    $('#qFor').textContent = t('quoteFor', p ? pname(p) : t('quoteGeneric'));
    $('#qDone').hidden = true; $('#qForm').reset(); $('#qDlg').showModal();
  }
  $('#qForm').addEventListener('submit', e => {
    e.preventDefault();
    // Quote form is a UI preview until database integration and anti-spam checks are complete.
    $('#qDone').textContent = lang === 'bg'
      ? 'Формата още не изпраща запитвания. Моля, свържете се с нас по телефон или имейл.'
      : 'This form does not send enquiries yet. Please contact us by phone or email.';
    $('#qDone').hidden = false;
  });

  /* ---------- one delegated click handler for the whole page ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-add],[data-open],[data-quote],[data-close],[data-step],[data-remove],#goCheckout,#pAdd');
    if (!el) return;
    if (el.dataset.add) addToCart(el.dataset.add, 1, el);
    else if (el.dataset.quote !== undefined) { el.closest('dialog')?.close(); openQuote(el.dataset.quote); }
    else if (el.dataset.open) openProduct(el.dataset.open);
    else if (el.hasAttribute('data-close')) el.closest('dialog').close();
    else if (el.dataset.step) {
      const inp = el.parentElement.querySelector('input'); inp.value = Math.max(1, (+inp.value || 1) + +el.dataset.step);
      el.dataset.id === 'p' ? updateLine() : setQty(el.dataset.id, +inp.value);
    }
    else if (el.dataset.remove) setQty(el.dataset.remove, 0);
    else if (el.id === 'pAdd') addToCart(cur.id, Math.max(1, +$('#pDlg [data-qty="p"]').value || 1), el);
    else if (el.id === 'goCheckout') {
      $('#cartDlg').close(); $('#coForm').hidden = false; $('#coDone').hidden = true; $('#coError').hidden = true;
      syncCheckout(); $('#coDlg').showModal();
    }
  });
  document.addEventListener('change', e => { const id = e.target.dataset?.qty; if (id && id !== 'p') setQty(id, +e.target.value); });
  document.addEventListener('input', e => { if (e.target.dataset?.qty === 'p') updateLine(); });
  $$('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); })); // a click on the backdrop closes

  /* ---------- newsletter (prototype: no backend yet) ---------- */
  $('#news').addEventListener('submit', e => { e.preventDefault(); const b = $('#newsBtn'); b.textContent = t('subscribed'); b.disabled = true; });

  /* ---------- cookie consent: nothing optional loads before a choice ---------- */
  const ck = $('#cookie');
  const saveConsent = (analytics, chat) => { store.set('kp_consent', { analytics, chat, at: new Date().toISOString(), v: 1 }); ck.hidden = true; $('#ckPrefs').hidden = true; };
  if (!store.get('kp_consent', null)) ck.hidden = false;
  $('#ckAll').addEventListener('click', () => saveConsent(true, true));
  $('#ckReject').addEventListener('click', () => saveConsent(false, false));
  $('#ckSettings').addEventListener('click', () => {
    if ($('#ckPrefs').hidden) { $('#ckPrefs').hidden = false; $('#ckSettings').textContent = t('ckSave'); }
    else saveConsent($('#ckAnalytics').checked, $('#ckChat').checked);
  });
  $('#cookieLink').addEventListener('click', e => {
    e.preventDefault(); const c = store.get('kp_consent', {}) || {};
    $('#ckAnalytics').checked = !!c.analytics; $('#ckChat').checked = !!c.chat; $('#ckPrefs').hidden = false; $('#ckSettings').textContent = t('ckSave'); ck.hidden = false;
  });

  /* ---------- reveal with 70ms stagger ---------- */
  if ('IntersectionObserver' in window && !reduce) {
    const rvs = $$('.rv');
    rvs.forEach(el => { if (el.getBoundingClientRect().top > innerHeight) el.classList.add('wait'); }); // only below the fold, so the first frame is complete
    const io = new IntersectionObserver(es => {
      es.filter(e => e.isIntersecting).forEach((e, i) => { e.target.style.transitionDelay = i * 70 + 'ms'; e.target.classList.remove('wait'); io.unobserve(e.target); });
    }, { rootMargin: '0px 0px -8% 0px' });
    rvs.forEach(el => io.observe(el));
  }

  /* ---------- counters (CSS does the easing) ---------- */
  const cio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('go'); cio.unobserve(e.target); } }), { threshold: .6 });
  $$('.count').forEach(c => cio.observe(c));

  /* ---------- flute macro animation, started only once visible ---------- */
  const cv = $('#macro'), cx = cv.getContext('2d'); let running = false, t0 = 0;
  function frame(tm) {
    if (!running) return;
    const r = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * r) { cv.width = W * r; cv.height = H * r; }
    cx.setTransform(r, 0, 0, r, 0, 0); cx.clearRect(0, 0, W, H);
    const shift = reduce ? 0 : (tm - t0) * 0.04, len = W / 3.2, amp = H * .16, mid = H * .5;
    cx.fillStyle = '#c99a5b'; cx.fillRect(0, mid - amp - 10, W, 9); cx.fillRect(0, mid + amp + 1, W, 9);
    cx.strokeStyle = '#b07e48'; cx.lineWidth = Math.max(5, H * .03); cx.beginPath();
    for (let x = -10; x <= W + 10; x += 3) { const y = mid + Math.sin((x + shift) / len * Math.PI * 2) * amp; x < -9 ? cx.moveTo(x, y) : cx.lineTo(x, y); }
    cx.stroke();
    requestAnimationFrame(frame);
  }
  new IntersectionObserver(([e]) => { if (e.isIntersecting && !running) { running = true; t0 = performance.now(); requestAnimationFrame(frame); } else if (!e.isIntersecting) running = false; }).observe(cv);

  /* ---------- scroll: progress, hero depth, promo drift ---------- */
  const prog = $('#progress'), word = $('#heroWord'), hbox = $('#heroBox'), season = $('#seasonImg > img');
  let ticking = false;
  function onScroll() {
    ticking = false;
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    prog.style.setProperty('--sp', max > 0 ? (y / max).toFixed(4) : 0);
    $('#nav').classList.toggle('nav--compact', y > 160);
    if (reduce) return;
    if (y < innerHeight * 1.5) { word.style.transform = `translate3d(0,${y * .1}px,0)`; hbox.style.transform = `translate3d(0,${y * .45}px,0)`; }
    const r = season.parentElement.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) season.style.setProperty('--dy', ((r.top + r.height / 2 - innerHeight / 2) * -0.12).toFixed(1) + 'px');
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener('resize', onScroll);

  applyLang(); onScroll();
})();
</script>
</body>
</html>
